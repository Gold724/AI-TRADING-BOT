# AI Trading Sentinel - Supervisor Configuration
# Manages multiple processes in production Docker container

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Nginx Web Server
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
user=root
priority=100

# AI Trading Sentinel Main Bot
[program:trading-bot]
command=/opt/venv/bin/python main.py
directory=/app
autorestart=true
startretries=3
user=sentinel
environment=PATH="/opt/venv/bin:%(ENV_PATH)s",DISPLAY=":99"
stdout_logfile=/var/log/supervisor/trading-bot.log
stderr_logfile=/var/log/supervisor/trading-bot_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
priority=200
stopsignal=TERM
stopwaitsecs=30

# Backend API Server (if separate from main bot)
[program:api-server]
command=/opt/venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app
autorestart=true
startretries=3
user=sentinel
environment=PATH="/opt/venv/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/supervisor/api-server.log
stderr_logfile=/var/log/supervisor/api-server_error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
priority=300
stopsignal=TERM
stopwaitsecs=15

# Health Monitor
[program:health-monitor]
command=/opt/venv/bin/python health_check.py --interval 60
directory=/app
autorestart=true
startretries=3
user=sentinel
environment=PATH="/opt/venv/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/supervisor/health-monitor.log
stderr_logfile=/var/log/supervisor/health-monitor_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=400
stopsignal=TERM
stopwaitsecs=10

# Xvfb Virtual Display (for headless browser)
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb_error.log
priority=50
stopsignal=TERM
stopwaitsecs=5

# Log Rotator (custom script)
[program:log-rotator]
command=/bin/bash -c "while true; do find /var/log -name '*.log' -size +100M -exec truncate -s 50M {} \;; sleep 3600; done"
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/log-rotator.log
stderr_logfile=/var/log/supervisor/log-rotator_error.log
priority=500
stopsignal=TERM
stopwaitsecs=5

# Signal Router (if using separate signal processing)
[program:signal-router]
command=/opt/venv/bin/python signal_router.py
directory=/app
autorestart=true
startretries=3
user=sentinel
environment=PATH="/opt/venv/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/supervisor/signal-router.log
stderr_logfile=/var/log/supervisor/signal-router_error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=250
stopsignal=TERM
stopwaitsecs=15
autostart=false  # Only start if signal routing is enabled

# News Monitor (if using news-based trading)
[program:news-monitor]
command=/opt/venv/bin/python news_guard.py
directory=/app
autorestart=true
startretries=3
user=sentinel
environment=PATH="/opt/venv/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/supervisor/news-monitor.log
stderr_logfile=/var/log/supervisor/news-monitor_error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=350
stopsignal=TERM
stopwaitsecs=10
autostart=false  # Only start if news monitoring is enabled

# Group definitions for easier management
[group:core]
programs=nginx,trading-bot,health-monitor,xvfb
priority=100

[group:api]
programs=api-server
priority=200

[group:optional]
programs=signal-router,news-monitor
priority=300

[group:maintenance]
programs=log-rotator
priority=400

# Event listeners for notifications
[eventlistener:crashmail]
command=/opt/venv/bin/python /app/scripts/crash_notifier.py
events=PROCESS_STATE_FATAL
user=sentinel
autostart=false  # Enable if crash notifications are configured

[eventlistener:memmon]
command=/opt/venv/bin/python /app/scripts/memory_monitor.py
events=TICK_60
user=sentinel
autostart=false  # Enable if memory monitoring is needed