apiVersion: v2
name: trading-sentinel
description: AI Trading Sentinel - Multi-Account Automated Trading Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/your-org/ai-trading-sentinel
sources:
  - https://github.com/your-org/ai-trading-sentinel
maintainers:
  - name: Trading Sentinel Team
    email: team@trading-sentinel.com
keywords:
  - trading
  - automation
  - fintech
  - kubernetes
  - microservices
annotations:
  category: Financial Technology
  licenses: MIT

dependencies:
  - name: postgresql
    version: "12.1.9"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.4.3"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: "15.18.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.50.7"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled
  - name: nginx-ingress
    version: "4.4.2"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress.nginx.enabled