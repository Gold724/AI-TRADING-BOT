# Kubernetes Deployment for TradeBot Sentinel
# Provides auto-scaling, high availability, and health checks

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradebot-sentinel
  namespace: tradebot
  labels:
    app: tradebot-sentinel
    version: v1.0.0
    component: trading-bot
    tier: application
spec:
  replicas: 2  # Start with 2 replicas for HA
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero downtime
  selector:
    matchLabels:
      app: tradebot-sentinel
  template:
    metadata:
      labels:
        app: tradebot-sentinel
        version: v1.0.0
        component: trading-bot
        tier: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      # Service account for RBAC
      serviceAccountName: tradebot-service-account
      
      # Node selection
      nodeSelector:
        kubernetes.io/os: linux
        node-type: worker
      
      # Tolerations for dedicated nodes
      tolerations:
        - key: "tradebot-dedicated"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      
      # Affinity rules
      affinity:
        # Prefer to spread pods across different nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tradebot-sentinel
                topologyKey: kubernetes.io/hostname
        
        # Prefer nodes with SSD storage
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: storage-type
                    operator: In
                    values:
                      - ssd
      
      # Init containers
      initContainers:
        # Database migration and setup
        - name: db-migrate
          image: tradebot-sentinel:latest
          command: ['python', 'manage.py', 'migrate']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tradebot-secrets
                  key: database-url
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
        
        # Wait for dependencies
        - name: wait-for-deps
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Dependencies are ready!"
      
      containers:
        # Main TradeBot application
        - name: tradebot-app
          image: tradebot-sentinel:latest
          imagePullPolicy: Always
          
          # Resource limits and requests
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              ephemeral-storage: "5Gi"
          
          # Environment variables
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PLAYWRIGHT_BROWSERS_PATH
              value: "/app/browsers"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          
          # Environment from secrets and configmaps
          envFrom:
            - secretRef:
                name: tradebot-secrets
            - configMapRef:
                name: tradebot-config
          
          # Ports
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: health
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30  # Allow 5 minutes for startup
          
          # Volume mounts
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            - name: logs-volume
              mountPath: /app/logs
            - name: data-volume
              mountPath: /app/data
            - name: browser-cache
              mountPath: /app/browser-cache
            - name: tmp-volume
              mountPath: /tmp
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
        
        # Health check sidecar
        - name: health-monitor
          image: tradebot-health:latest
          imagePullPolicy: Always
          
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          
          ports:
            - name: health-port
              containerPort: 8001
              protocol: TCP
          
          env:
            - name: MAIN_APP_URL
              value: "http://localhost:8000"
            - name: CHECK_INTERVAL
              value: "30"
          
          livenessProbe:
            httpGet:
              path: /ping
              port: health-port
            initialDelaySeconds: 10
            periodSeconds: 30
          
          readinessProbe:
            httpGet:
              path: /ping
              port: health-port
            initialDelaySeconds: 5
            periodSeconds: 10
          
          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs
              readOnly: true
        
        # Log shipping sidecar
        - name: log-shipper
          image: grafana/promtail:2.9.0
          args:
            - -config.file=/etc/promtail/config.yml
          
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          
          volumeMounts:
            - name: logs-volume
              mountPath: /app/logs
              readOnly: true
            - name: promtail-config
              mountPath: /etc/promtail
              readOnly: true
      
      # Volumes
      volumes:
        - name: config-volume
          configMap:
            name: tradebot-config
            defaultMode: 0644
        
        - name: logs-volume
          emptyDir:
            sizeLimit: 1Gi
        
        - name: data-volume
          persistentVolumeClaim:
            claimName: tradebot-data-pvc
        
        - name: browser-cache
          emptyDir:
            sizeLimit: 500Mi
        
        - name: tmp-volume
          emptyDir:
            sizeLimit: 100Mi
        
        - name: promtail-config
          configMap:
            name: promtail-config
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: edns0
      
      # Restart policy
      restartPolicy: Always
      
      # Termination grace period
      terminationGracePeriodSeconds: 60
      
      # Image pull secrets
      imagePullSecrets:
        - name: docker-registry-secret

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tradebot-sentinel-hpa
  namespace: tradebot
  labels:
    app: tradebot-sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tradebot-sentinel
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metrics - trading activity
    - type: Pods
      pods:
        metric:
          name: trades_per_second
        target:
          type: AverageValue
          averageValue: "10"
    
    # Custom metrics - error rate
    - type: Pods
      pods:
        metric:
          name: error_rate_percent
        target:
          type: AverageValue
          averageValue: "5"
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tradebot-sentinel-pdb
  namespace: tradebot
  labels:
    app: tradebot-sentinel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tradebot-sentinel

---
# Vertical Pod Autoscaler (optional)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tradebot-sentinel-vpa
  namespace: tradebot
  labels:
    app: tradebot-sentinel
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tradebot-sentinel
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: tradebot-app
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 4Gi
        controlledResources: ["cpu", "memory"]
      - containerName: health-monitor
        minAllowed:
          cpu: 25m
          memory: 32Mi
        maxAllowed:
          cpu: 200m
          memory: 256Mi
        controlledResources: ["cpu", "memory"]