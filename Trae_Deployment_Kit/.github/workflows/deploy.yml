name: Deploy to Contabo VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run backend tests
        run: |
          pytest
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm test
      
      - name: Send Slack notification for test results
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: 'Test phase ${{ job.status }} for Trae AI Trading Bot'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace
      
      - name: Create .env file
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env
          echo "API_SECRET=${{ secrets.API_SECRET }}" >> .env
          echo "BROKER_URL=${{ secrets.BROKER_URL }}" >> .env
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
      
      - name: Deploy to VPS
        id: deploy
        run: |
          # Install rsync
          sudo apt-get update && sudo apt-get install -y rsync
          
          # Exclude unnecessary files
          rsync -avz --exclude '.git' --exclude '__pycache__' --exclude 'venv' --exclude 'node_modules' \
            -e "ssh -p ${{ secrets.CONTABO_SSH_PORT || '22' }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.CONTABO_USERNAME || 'root' }}@${{ secrets.CONTABO_VPS_IP || '161.97.112.146' }}:~/ai-trading-sentinel/
          
          # Setup and restart service
          ssh -p ${{ secrets.CONTABO_SSH_PORT || '22' }} -o StrictHostKeyChecking=no ${{ secrets.CONTABO_USERNAME || 'root' }}@${{ secrets.CONTABO_VPS_IP || '161.97.112.146' }} \
            "cd ~/ai-trading-sentinel && \
             python3 -m venv venv && \
             source venv/bin/activate && \
             pip install --upgrade pip && \
             pip install -r requirements.txt && \
             cd frontend && npm install && \
             cd .. && \
             sudo cp trae.service /etc/systemd/system/ && \
             sudo systemctl daemon-reload && \
             sudo systemctl restart trae && \
             sudo systemctl status trae"
      
      - name: Send Slack notification for deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: 'Deployment ${{ job.status }} for Trae AI Trading Bot to ${{ secrets.CONTABO_VPS_IP || "161.97.112.146" }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Verify service status
        if: success()
        run: |
          ssh -p ${{ secrets.CONTABO_SSH_PORT || '22' }} -o StrictHostKeyChecking=no ${{ secrets.CONTABO_USERNAME || 'root' }}@${{ secrets.CONTABO_VPS_IP || '161.97.112.146' }} \
            "sudo systemctl is-active trae"

      - name: Send detailed Slack notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Trae AI Trading Bot Deployment"
          SLACK_MESSAGE: "Deployment to Contabo VPS ${{ job.status }}. Environment: ${{ github.event.inputs.environment || 'production' }}"
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_FOOTER: "Deployed from ${{ github.repository }} | ${{ github.workflow }}"