services:
  # AI Trading Sentinel Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: aitrading-backend:latest
    container_name: aitrading-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=backend_main.py
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - API_HOST=0.0.0.0
      - API_PORT=5000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./temp:/app/temp
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AI Trading Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: aitrading-bot:latest
    container_name: aitrading-bot
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - BACKEND_URL=http://backend:5000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./temp:/app/temp
      - ./chrome_profile:/app/chrome_profile
      - /dev/shm:/dev/shm
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: aitrading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./AI-TRADING-BOT/frontend
      dockerfile: Dockerfile
    container_name: aitrading-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WEBSOCKET_URL=ws://localhost:5000
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring Service
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: aitrading-monitor
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:5000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aitrading-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    depends_on:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Log aggregation and monitoring
  logrotate:
    image: alpine:latest
    container_name: aitrading-logrotate
    restart: unless-stopped
    volumes:
      - ./logs:/logs
      - ./logrotate.conf:/etc/logrotate.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - aitrading-network
    command: >
      sh -c "apk add --no-cache logrotate dcron &&
             echo '0 2 * * * /usr/sbin/logrotate /etc/logrotate.conf' | crontab - &&
             crond -f"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Health check and alerting
  # healthcheck:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.healthcheck
  #   container_name: aitrading-healthcheck
  #   restart: unless-stopped
  #   environment:
  #     - PYTHONUNBUFFERED=1
  #     - CHECK_INTERVAL=60
  #     - BACKEND_URL=http://backend:5000
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./logs:/app/logs
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /etc/localtime:/etc/localtime:ro
  #   networks:
  #     - aitrading-network
  #   depends_on:
  #     - backend
  #     - bot

networks:
  aitrading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
    driver: local
  nginx-ssl:
    driver: local

# Add these volume mappings to your services
volumes:
  # Map data directories
  - "D:\trae-data:/app/data"
  - "E:\trae-logs:/app/logs"
  - "D:\trae-data\cache:/app/cache"
  - "E:\checkpoints:/app/checkpoints"
  
# Update environment variables
environment:
  - TRAE_DATA_DIR=/app/data
  - TRAE_LOGS_DIR=/app/logs
  - TRAE_CACHE_DIR=/app/cache
  - LOG_DIR=/app/logs