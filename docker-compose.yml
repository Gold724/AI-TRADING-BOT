# AI Trading Sentinel - Cloud Deployment Configuration
# Optimized for production cloud environments

version: '3.8'

services:
  # Main Trading Bot Service
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-trading-sentinel
    restart: unless-stopped
    environment:
      - BULENOX_USERNAME=BX64883
      - BULENOX_PASSWORD=XujhMzFf6K
      - ENVIRONMENT=production
      - HEADLESS=true
      - LOG_LEVEL=INFO
      - TZ=UTC
    volumes:
      - ./logs:/home/tradebot/app/logs
      - ./screenshots:/home/tradebot/app/screenshots
      - ./data:/home/tradebot/app/data
      - ./backups:/home/tradebot/app/backups
    ports:
      - "8080:8080"
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; exit(0 if os.path.exists('logs/health.log') else 1)"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tradingbot123}
    volumes:
      - redis-data:/data
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Monitoring Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: trading-dashboard
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-tradingbot123}@redis:6379/0
      - DASHBOARD_SECRET=${DASHBOARD_SECRET:-dashboard123}
    ports:
      - "3000:3000"
    networks:
      - trading-network
    depends_on:
      - redis
      - trading-bot
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: trading-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - trading-network
    depends_on:
      - trading-bot
      - dashboard
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Log Aggregator (Optional)
  logrotate:
    image: alpine:latest
    container_name: trading-logrotate
    restart: unless-stopped
    volumes:
      - ./logs:/logs
      - ./scripts/logrotate.sh:/usr/local/bin/logrotate.sh:ro
    command: |
      sh -c '
        while true; do
          /usr/local/bin/logrotate.sh
          sleep 3600
        done
      '
    networks:
      - trading-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'

networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
    driver: local