# Fail2Ban filter for login brute force detection
# Detects repeated failed login attempts

[Definition]

# Detect login brute force attempts
failregex = ^<HOST> .* "POST /(api/)?(login|auth|signin|authenticate).*" (401|403) .*$
            ^<HOST> .* "POST /(api/)?(login|auth|signin|authenticate).*" [0-9]+ [0-9]+ ".*" ".*" [0-9]+\.[0-9]+ [0-9]+\.[0-9]+$
            ^<HOST> .* "POST /(api/)?(login|auth|signin|authenticate).*" (400|422) .*$
            ^<HOST> .* "GET /(api/)?(login|auth|signin|authenticate).*" (405) .*$
            ^<HOST> .* "(PUT|DELETE|PATCH) /(api/)?(login|auth|signin|authenticate).*" (405) .*$

# Ignore successful logins and legitimate requests
ignoreregex = ^<HOST> .* "POST /(api/)?(login|auth|signin|authenticate).*" (200|201|202) .*$
              ^<HOST> .* "GET /(api/)?(logout|signout).*" (200|201|202|204) .*$
              ^<HOST> .* "OPTIONS /(api/)?(login|auth|signin|authenticate).*" (200|204) .*$

# Date pattern for Nginx logs
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S %%z

# Journal match for systemd journal
journalmatch = _SYSTEMD_UNIT=nginx.service