# Fail2Ban filter for API abuse detection
# Detects excessive API requests and abuse patterns

[Definition]

# Detect API abuse patterns
failregex = ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/.*" (429|503) .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/.*" [0-9]+ [0-9]+ ".*" ".*" [0-9]+\.[0-9]+ [0-9]+\.[0-9]+$
            ^<HOST> .* "POST /api/(login|auth|signin).*" (401|403) .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/.*" (400|422) .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/.*" [0-9]+ 0 ".*" ".*"$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/.*" [0-9]+ [0-9]+ ".*" "(curl|wget|python-requests|Go-http-client|Java|Apache-HttpClient|okhttp).*"$

# Ignore legitimate API usage
ignoreregex = ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/(health|status|version).*" (200|201|202|204) .*$
              ^<HOST> .* "OPTIONS /api/.*" (200|204) .*$
              ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /api/.*" (200|201|202|204) .*" "Mozilla/.*"$

# Date pattern for Nginx logs
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S %%z

# Journal match for systemd journal
journalmatch = _SYSTEMD_UNIT=nginx.service