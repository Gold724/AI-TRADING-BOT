# Fail2Ban filter for bad bot detection
# Detects malicious bots and scanners

[Definition]

# Detect bad bots and scanners
failregex = ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "(sqlmap|nikto|nmap|masscan|zmap|nessus|openvas|vega|burp|w3af|skipfish|wpscan|dirbuster|dirb|gobuster|wfuzz|hydra|medusa|john|hashcat).*"$
            ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "(.*bot.*|.*crawler.*|.*spider.*|.*scraper.*|.*harvester.*|.*extractor.*|.*scanner.*|.*probe.*|.*test.*|.*check.*)"$
            ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "(curl|wget|python-requests|Go-http-client|Java|Apache-HttpClient|okhttp|libwww-perl|lwp-trivial|urllib|httpie|postman).*"$
            ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "(.*exploit.*|.*hack.*|.*attack.*|.*penetration.*|.*security.*|.*vuln.*|.*malware.*|.*trojan.*|.*virus.*)"$
            ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "(.*injection.*|.*xss.*|.*csrf.*|.*lfi.*|.*rfi.*|.*sqli.*|.*shell.*|.*backdoor.*)"$
            ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" ""$
            ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "-"$
            ^<HOST> .* "(HEAD|TRACE|CONNECT|PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK) .*" [0-9]+ .*$
            ^<HOST> .* ".*" (400|403|404|405|406|408|409|410|411|412|413|414|415|416|417|418|421|422|423|424|425|426|428|429|431|451|500|501|502|503|504|505|506|507|508|510|511) .*$

# Ignore legitimate bots and crawlers
ignoreregex = ^<HOST> .* ".*" [0-9]+ [0-9]+ ".*" "(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|facebookexternalhit|Twitterbot|LinkedInBot|WhatsApp|Telegram|Slack|Discord|Mozilla/.*)"$
              ^<HOST> .* "GET /(robots\.txt|sitemap\.xml|favicon\.ico).*" (200|404) .*$
              ^<HOST> .* "GET /(api/)?(health|status|version).*" 200 .*$

# Date pattern for Nginx logs
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S %%z

# Journal match for systemd journal
journalmatch = _SYSTEMD_UNIT=nginx.service