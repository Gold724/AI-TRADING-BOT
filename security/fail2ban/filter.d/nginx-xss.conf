# Fail2Ban filter for XSS (Cross-Site Scripting) detection
# Detects XSS attempts in web requests

[Definition]

# Detect XSS patterns
failregex = ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\<script|\</script\>|javascript:|vbscript:|data:text/html).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(onload=|onerror=|onclick=|onmouseover=|onmouseout=|onfocus=|onblur=|onchange=|onsubmit=).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(alert\(|confirm\(|prompt\(|document\.|window\.|eval\(|setTimeout\(|setInterval\().*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\<iframe|\<object|\<embed|\<applet|\<form|\<input|\<img.*onerror).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(expression\(|@import|behaviour:|moz-binding:|binding:).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\%3Cscript|\%3C/script\%3E|\%3Ciframe|\%3Cobject|\%3Cembed).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(String\.fromCharCode|unescape\(|decodeURI\(|decodeURIComponent\().*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\\x3c|\\u003c|\\x3e|\\u003e|\\x22|\\u0022|\\x27|\\u0027).*" [0-9]+ .*$

# Ignore legitimate requests
ignoreregex = ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /(api/)?(health|status|version).*" (200|201|202|204) .*$
              ^<HOST> .* "OPTIONS .*" (200|204) .*$
              ^<HOST> .* "GET /(static/|assets/|favicon\.ico|robots\.txt).*" (200|304) .*$

# Date pattern for Nginx logs
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S %%z

# Journal match for systemd journal
journalmatch = _SYSTEMD_UNIT=nginx.service