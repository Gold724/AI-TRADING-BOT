# Fail2Ban filter for SQL injection detection
# Detects SQL injection attempts in web requests

[Definition]

# Detect SQL injection patterns
failregex = ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(union.*select|select.*from|insert.*into|delete.*from|drop.*table|update.*set|create.*table|alter.*table|grant.*on|revoke.*from).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\'.*union|\".*union|\%27.*union|\%22.*union).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\'.*or.*1.*=.*1|\".*or.*1.*=.*1|\%27.*or.*1.*=.*1|\%22.*or.*1.*=.*1).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\';.*--|\".*;.*--|\%27.*;.*--|\%22.*;.*--).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(information_schema|mysql\.|pg_|sys\.|master\.|msdb\.).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(concat\(|group_concat\(|char\(|ascii\(|substring\(|mid\(|left\(|right\().*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(benchmark\(|sleep\(|waitfor.*delay|pg_sleep\().*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(load_file\(|into.*outfile|into.*dumpfile).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(exec\(|execute\(|sp_|xp_).*" [0-9]+ .*$
            ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) .*(\\x[0-9a-f]{2}|\\[0-7]{3}|\\u[0-9a-f]{4}).*" [0-9]+ .*$

# Ignore legitimate database-related requests
ignoreregex = ^<HOST> .* "(GET|POST|PUT|DELETE|PATCH) /(api/)?(health|status|version).*" (200|201|202|204) .*$
              ^<HOST> .* "OPTIONS .*" (200|204) .*$

# Date pattern for Nginx logs
datepattern = ^%%d/%%b/%%Y:%%H:%%M:%%S %%z

# Journal match for systemd journal
journalmatch = _SYSTEMD_UNIT=nginx.service