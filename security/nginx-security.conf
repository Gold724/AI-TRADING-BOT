# Advanced Nginx Security Configuration
# WAF (Web Application Firewall) Rules and DDoS Protection

# Rate limiting zones for DDoS protection
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# Security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'none';" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Hide Nginx version
server_tokens off;

# Block common attack patterns
map $request_uri $blocked_uri {
    ~*\.(aspx?|php|jsp|cgi)$ 1;
    ~*/wp-admin 1;
    ~*/wp-login 1;
    ~*/phpmyadmin 1;
    ~*/admin 1;
    ~*/xmlrpc.php 1;
    ~*/wp-config.php 1;
    ~*\.env$ 1;
    ~*/\.git 1;
    ~*/\.svn 1;
    default 0;
}

# Block malicious user agents
map $http_user_agent $blocked_agent {
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*zmap 1;
    ~*nessus 1;
    ~*openvas 1;
    ~*vega 1;
    ~*burp 1;
    ~*w3af 1;
    ~*skipfish 1;
    ~*wpscan 1;
    ~*dirbuster 1;
    ~*dirb 1;
    ~*gobuster 1;
    ~*wfuzz 1;
    ~*hydra 1;
    ~*medusa 1;
    ~*john 1;
    ~*hashcat 1;
    default 0;
}

# Block suspicious request methods
map $request_method $blocked_method {
    ~*^(TRACE|DELETE|PATCH)$ 1;
    default 0;
}

# GeoIP blocking (requires GeoIP module)
# Uncomment and configure based on your needs
# map $geoip_country_code $blocked_country {
#     CN 1;  # China
#     RU 1;  # Russia
#     KP 1;  # North Korea
#     IR 1;  # Iran
#     default 0;
# }

# SQL Injection patterns
map $args $sql_injection {
    ~*union.*select 1;
    ~*select.*from 1;
    ~*insert.*into 1;
    ~*delete.*from 1;
    ~*drop.*table 1;
    ~*update.*set 1;
    ~*script.*alert 1;
    ~*javascript: 1;
    ~*vbscript: 1;
    ~*onload 1;
    ~*onerror 1;
    ~*onclick 1;
    default 0;
}

# XSS patterns
map $args $xss_injection {
    ~*<script 1;
    ~*</script> 1;
    ~*<iframe 1;
    ~*<object 1;
    ~*<embed 1;
    ~*<applet 1;
    ~*javascript: 1;
    ~*vbscript: 1;
    ~*onload= 1;
    ~*onerror= 1;
    ~*onclick= 1;
    ~*onmouseover= 1;
    default 0;
}

# File inclusion patterns
map $args $file_inclusion {
    ~*\.\./ 1;
    ~*/etc/passwd 1;
    ~*/etc/shadow 1;
    ~*/proc/self/environ 1;
    ~*php://input 1;
    ~*php://filter 1;
    ~*data:// 1;
    ~*file:// 1;
    ~*ftp:// 1;
    ~*expect:// 1;
    default 0;
}

# Server block for security
server {
    listen 80;
    server_name _;
    
    # Block requests based on security rules
    if ($blocked_uri) {
        return 444;
    }
    
    if ($blocked_agent) {
        return 444;
    }
    
    if ($blocked_method) {
        return 405;
    }
    
    # if ($blocked_country) {
    #     return 444;
    # }
    
    if ($sql_injection) {
        return 444;
    }
    
    if ($xss_injection) {
        return 444;
    }
    
    if ($file_inclusion) {
        return 444;
    }
    
    # Rate limiting
    limit_req zone=general burst=50 nodelay;
    limit_conn conn_limit_per_ip 20;
    
    # Block requests with no User-Agent
    if ($http_user_agent = "") {
        return 444;
    }
    
    # Block requests with suspicious headers
    if ($http_x_forwarded_for ~* "(\\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\b.*){4,}") {
        return 444;
    }
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server block with enhanced security
server {
    listen 443 ssl http2;
    server_name your-domain.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security checks
    if ($blocked_uri) {
        return 444;
    }
    
    if ($blocked_agent) {
        return 444;
    }
    
    if ($blocked_method) {
        return 405;
    }
    
    if ($sql_injection) {
        return 444;
    }
    
    if ($xss_injection) {
        return 444;
    }
    
    if ($file_inclusion) {
        return 444;
    }
    
    # API endpoints with strict rate limiting
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        # Additional API security
        if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
            return 405;
        }
        
        # CORS headers for API
        add_header Access-Control-Allow-Origin "https://your-domain.com" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Security headers for API
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
    
    # Login endpoints with very strict rate limiting
    location ~ ^/(api/)?(login|auth|signin) {
        limit_req zone=login burst=5 nodelay;
        
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        
        # Security for static files
        location ~* \.(php|asp|aspx|jsp|cgi|pl)$ {
            return 444;
        }
    }
    
    # Frontend application
    location / {
        limit_req zone=general burst=50 nodelay;
        
        try_files $uri $uri/ /index.html;
        root /var/www/html;
        index index.html;
        
        # Security headers for frontend
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(env|log|bak|backup|old|tmp|temp|swp|swo|orig|rej)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint (internal only)
    location /health {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://backend/health;
    }
    
    # Monitoring endpoints (restricted access)
    location /metrics {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        
        proxy_pass http://prometheus:9090;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /var/www/html;
        internal;
    }
    
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}

# Upstream backend servers
upstream backend {
    least_conn;
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Log format for security analysis
log_format security_log '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time '
                       '$geoip_country_code $geoip_city';

# Access and error logs
access_log /var/log/nginx/access.log security_log;
error_log /var/log/nginx/error.log warn;