# AI Trading Sentinel - Security Monitor Configuration
# This file contains configuration parameters for the security monitoring daemon

# Monitoring intervals (in seconds)
MONITOR_INTERVAL=300                    # Main monitoring cycle interval (5 minutes)
QUICK_CHECK_INTERVAL=60                 # Quick security checks (1 minute)
DEEP_SCAN_INTERVAL=3600                 # Deep security scan (1 hour)

# Alert thresholds
ALERT_THRESHOLD_LOW=20                  # Low priority alert threshold
ALERT_THRESHOLD_MEDIUM=10               # Medium priority alert threshold
ALERT_THRESHOLD_HIGH=5                  # High priority alert threshold
ALERT_THRESHOLD_CRITICAL=1              # Critical alert threshold

# System resource thresholds
CPU_THRESHOLD_WARNING=80                # CPU usage warning threshold (%)
CPU_THRESHOLD_CRITICAL=95               # CPU usage critical threshold (%)
MEMORY_THRESHOLD_WARNING=85             # Memory usage warning threshold (%)
MEMORY_THRESHOLD_CRITICAL=95            # Memory usage critical threshold (%)
DISK_THRESHOLD_WARNING=85               # Disk usage warning threshold (%)
DISK_THRESHOLD_CRITICAL=95              # Disk usage critical threshold (%)
LOAD_MULTIPLIER=2                       # Load average multiplier (cores * multiplier)

# Network monitoring
MAX_CONNECTIONS=100                     # Maximum allowed network connections
SUSPICIOUS_PORTS="22,80,443,3306,5432,6379,27017,8080,8443,9000"
MONITOR_FOREIGN_CONNECTIONS=true       # Monitor foreign connections to sensitive ports

# Authentication monitoring
MAX_FAILED_LOGINS=10                   # Maximum failed login attempts before alert
MAX_SSH_SESSIONS=5                     # Maximum concurrent SSH sessions
MONITOR_ROOT_LOGINS=true               # Monitor root login attempts

# Process monitoring
MAX_ROOT_PROCESSES=50                   # Maximum root processes before alert
MONITOR_SUSPICIOUS_PROCESSES=true      # Monitor for suspicious processes
SUSPICIOUS_PROCESS_PATTERNS="nc,netcat,ncat,telnet,rsh,rlogin,nmap,masscan,sqlmap,nikto"

# File integrity monitoring
MONITOR_FILE_INTEGRITY=true            # Enable file integrity monitoring
CRITICAL_FILES="/etc/passwd,/etc/shadow,/etc/sudoers,/etc/ssh/sshd_config,/etc/nginx/nginx.conf"
MONITOR_CONFIG_FILES=true              # Monitor application config files

# Log monitoring
MAX_NGINX_ERRORS=20                    # Maximum Nginx errors before alert
MAX_KERNEL_ERRORS=5                    # Maximum kernel errors before alert
MAX_AUTH_FAILURES=15                   # Maximum auth failures before alert
LOG_RETENTION_DAYS=30                  # Log retention period

# Security services monitoring
MONITOR_FAIL2BAN=true                  # Monitor Fail2ban status
MONITOR_FIREWALL=true                  # Monitor firewall status
MONITOR_ANTIVIRUS=true                 # Monitor antivirus status
MAX_BANNED_IPS=50                      # Maximum banned IPs before alert

# Update monitoring
CHECK_SECURITY_UPDATES=true            # Check for security updates
UPDATE_CHECK_INTERVAL=86400            # Update check interval (24 hours)
AUTO_INSTALL_SECURITY_UPDATES=false    # Auto-install security updates

# Notification settings
ENABLE_SLACK_NOTIFICATIONS=true        # Enable Slack notifications
ENABLE_EMAIL_NOTIFICATIONS=true        # Enable email notifications
ENABLE_SMS_NOTIFICATIONS=false         # Enable SMS notifications
NOTIFICATION_COOLDOWN=1800             # Notification cooldown period (30 minutes)

# Slack configuration
SLACK_WEBHOOK_URL=""                    # Slack webhook URL (set in environment)
SLACK_CHANNEL="#security-alerts"       # Slack channel for alerts
SLACK_USERNAME="SecurityBot"           # Slack bot username
SLACK_ICON_EMOJI=":shield:"            # Slack bot emoji

# Email configuration
SECURITY_EMAIL=""                      # Security team email (set in environment)
EMAIL_FROM="security@trading-sentinel.com"  # From email address
SMTP_SERVER="localhost"                # SMTP server
SMTP_PORT=587                          # SMTP port
SMTP_USE_TLS=true                      # Use TLS for SMTP

# SMS configuration (if enabled)
SMS_API_URL=""                         # SMS API URL
SMS_API_KEY=""                         # SMS API key
SMS_PHONE_NUMBERS=""                   # Comma-separated phone numbers

# Logging configuration
LOG_LEVEL="INFO"                       # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
MAX_LOG_SIZE="100M"                    # Maximum log file size
LOG_ROTATION_COUNT=10                  # Number of rotated log files to keep
ENABLE_SYSLOG=true                     # Enable syslog integration
SYSLOG_FACILITY="local0"               # Syslog facility

# Performance settings
MAX_CONCURRENT_CHECKS=5                # Maximum concurrent security checks
CHECK_TIMEOUT=300                      # Timeout for individual checks (seconds)
ENABLE_PERFORMANCE_MONITORING=true     # Monitor performance metrics

# Database monitoring (if applicable)
MONITOR_DATABASE=true                  # Monitor database connections
DB_MAX_CONNECTIONS=100                 # Maximum database connections
DB_SLOW_QUERY_THRESHOLD=5              # Slow query threshold (seconds)

# Web application monitoring
MONITOR_WEB_APP=true                   # Monitor web application
WEB_RESPONSE_TIMEOUT=10                # Web response timeout (seconds)
WEB_ERROR_THRESHOLD=50                 # Web error threshold per hour
MONITOR_API_ENDPOINTS=true             # Monitor API endpoints

# Trading bot specific monitoring
MONITOR_TRADING_BOT=true               # Monitor trading bot processes
TRADING_BOT_PROCESSES="python,node"    # Trading bot process names
MONITOR_TRADING_LOGS=true              # Monitor trading bot logs
TRADING_ERROR_THRESHOLD=10             # Trading error threshold

# Docker monitoring (if using containers)
MONITOR_DOCKER=false                   # Monitor Docker containers
DOCKER_CONTAINER_NAMES=""              # Comma-separated container names to monitor
MONITOR_CONTAINER_RESOURCES=true       # Monitor container resource usage

# Backup monitoring
MONITOR_BACKUPS=true                   # Monitor backup processes
BACKUP_CHECK_INTERVAL=86400            # Backup check interval (24 hours)
BACKUP_RETENTION_DAYS=30               # Backup retention period

# Compliance and audit settings
ENABLE_AUDIT_LOGGING=true              # Enable audit logging
AUDIT_LOG_PATH="/var/log/audit"        # Audit log path
COMPLIANCE_CHECKS=true                 # Enable compliance checks
GDPR_COMPLIANCE=true                   # Enable GDPR compliance checks

# Advanced threat detection
ENABLE_ANOMALY_DETECTION=true          # Enable anomaly detection
ANOMALY_THRESHOLD=0.8                  # Anomaly detection threshold
ENABLE_BEHAVIORAL_ANALYSIS=true        # Enable behavioral analysis
LEARNING_PERIOD_DAYS=7                 # Learning period for behavioral analysis

# Integration settings
ENABLE_SIEM_INTEGRATION=false          # Enable SIEM integration
SIEM_ENDPOINT=""                       # SIEM endpoint URL
SIEM_API_KEY=""                        # SIEM API key

# Maintenance settings
AUTO_CLEANUP_LOGS=true                 # Auto cleanup old logs
AUTO_CLEANUP_REPORTS=true              # Auto cleanup old reports
AUTO_UPDATE_SIGNATURES=true            # Auto update security signatures
MAINTENANCE_WINDOW="02:00-04:00"       # Maintenance window (UTC)

# Debug and testing
DEBUG_MODE=false                       # Enable debug mode
TEST_MODE=false                        # Enable test mode (no real actions)
DRY_RUN=false                          # Dry run mode (log only, no actions)
VERBOSE_LOGGING=false                  # Enable verbose logging

# Custom rules and patterns
CUSTOM_ALERT_RULES=""                  # Path to custom alert rules file
CUSTOM_PATTERNS=""                     # Path to custom patterns file
CUSTOM_SCRIPTS_DIR=""                  # Directory for custom monitoring scripts

# Reporting settings
GENERATE_DAILY_REPORTS=true            # Generate daily security reports
GENERATE_WEEKLY_REPORTS=true           # Generate weekly security reports
GENERATE_MONTHLY_REPORTS=true          # Generate monthly security reports
REPORT_EMAIL_RECIPIENTS=""             # Email recipients for reports
REPORT_FORMAT="json,html"              # Report formats (json, html, pdf)

# API settings (for external monitoring tools)
ENABLE_API=false                       # Enable monitoring API
API_PORT=9090                          # API port
API_AUTH_TOKEN=""                      # API authentication token
API_RATE_LIMIT=100                     # API rate limit (requests per minute)