# AI Trading Sentinel - Prometheus Configuration
# TRAE-SentinelOps: Monitoring and alerting configuration for 24/7 reliability

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tradebot-monitor'

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Trading Bot Metrics
  - job_name: 'tradebot'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 5s

  # API Service Metrics
  - job_name: 'api'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']

  # System Metrics
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # Docker Metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']

  # Nginx Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['localhost:9113']