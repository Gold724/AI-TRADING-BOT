# AI Trading Sentinel - Prometheus Alert Rules
# TRAE-SentinelOps: Critical monitoring alerts for 24/7 reliability

groups:
  - name: tradebot-alerts
    rules:
      - alert: TradeBotDown
        expr: up{job="tradebot"} == 0
        for: 1m
        labels:
          severity: critical
          service: tradebot
        annotations:
          summary: "TradeBot service is down"
          description: "TradeBot has been down for more than 1 minute"
          action: "Check container status with 'docker ps' and restart if needed"

      - alert: TradeBotHighCPU
        expr: rate(process_cpu_seconds_total{job="tradebot"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: tradebot
        annotations:
          summary: "TradeBot high CPU usage"
          description: "TradeBot CPU usage is above 80% for 5 minutes"
          action: "Check for infinite loops or resource-heavy operations"

      - alert: TradeBotHighMemory
        expr: process_resident_memory_bytes{job="tradebot"} / 1024 / 1024 > 1024
        for: 5m
        labels:
          severity: warning
          service: tradebot
        annotations:
          summary: "TradeBot high memory usage"
          description: "TradeBot memory usage is above 1GB"
          action: "Check for memory leaks or large data processing"

      - alert: TradeBotErrors
        expr: rate(tradebot_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: tradebot
        annotations:
          summary: "TradeBot error rate high"
          description: "TradeBot error rate is {{ $value }} errors per second"
          action: "Check logs for error details"

      - alert: TradeBotNoTrades
        expr: rate(tradebot_trades_total[10m]) == 0
        for: 30m
        labels:
          severity: warning
          service: tradebot
        annotations:
          summary: "No trades executed"
          description: "No trades have been executed in the last 30 minutes"
          action: "Check market conditions and bot configuration"

  - name: api-alerts
    rules:
      - alert: APIDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API service is down"
          description: "API has been down for more than 1 minute"
          action: "Check container status and restart if needed"

      - alert: APIHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API high response time"
          description: "95th percentile response time is above 2 seconds"
          action: "Check API performance and database queries"

  - name: redis-alerts
    rules:
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"
          action: "Check Redis container and restart if needed"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 90%"
          action: "Consider Redis memory optimization"

  - name: system-alerts
    rules:
      - alert: SystemDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Node exporter is down"
          description: "System metrics collection is down"
          action: "Check node exporter service"

      - alert: HighCPU
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%"
          action: "Check running processes"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 80%"
          action: "Check memory usage and processes"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Disk space low"
          description: "Disk space is below 10% on {{ $labels.mountpoint }}"
          action: "Free up disk space"

      - alert: LoadAverageHigh
        expr: node_load1 > 2
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High load average"
          description: "Load average is above 2"
          action: "Check system load"

  - name: trading-alerts
    rules:
      - alert: DrawdownHigh
        expr: tradebot_drawdown_percentage > 10
        for: 1m
        labels:
          severity: critical
          service: tradebot
        annotations:
          summary: "High drawdown detected"
          description: "Current drawdown is {{ $value }}%"
          action: "Consider stopping trading and reviewing strategy"

      - alert: ConsecutiveLosses
        expr: tradebot_consecutive_losses > 5
        for: 1m
        labels:
          severity: warning
          service: tradebot
        annotations:
          summary: "Consecutive losses"
          description: "{{ $value }} consecutive losses detected"
          action: "Review trading strategy and risk management"

      - alert: DailyProfitTargetReached
        expr: tradebot_daily_profit >= tradebot_daily_target
        for: 1m
        labels:
          severity: info
          service: tradebot
        annotations:
          summary: "Daily profit target reached"
          description: "Daily profit target of ${{ $value }} reached"
          action: "Consider stopping trading for the day"