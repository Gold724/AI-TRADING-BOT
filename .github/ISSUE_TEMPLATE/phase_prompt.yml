name: TRAE Phase Prompt - Phase 9
description: Establish Self-Governance and Protocol Sovereignty
title: "[PHASE]: 9 - Governance & Sovereignty Layer"
labels: ["trae-phase", "governance", "sovereignty", "auto-trigger"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## TRAE Phase Prompt
        This issue will guide the TRAE system through a specific operational phase.
  
  - type: input
    id: phase_number
    attributes:
      label: Phase Number
      description: The phase number for this prompt (e.g., 1, 2, 3)
      placeholder: "9"
    validations:
      required: true
  
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the main aim of this phase
      placeholder: "Enable voting, role delegation, and protocol protection"
    validations:
      required: true
  
  - type: textarea
    id: system_components
    attributes:
      label: System Components Affected
      description: List files/modules to be modified
      placeholder: "- sentinel_decider.py\n- governance_engine.py\n- config_manager.py"
    validations:
      required: true
  
  - type: textarea
    id: execution_commands
    attributes:
      label: Execution Commands
      description: Any specific commands that should be run for this phase
      placeholder: "./activate_adaptive_intelligence.sh --mode full"
    validations:
      required: false
  
  - type: checkboxes
    id: trigger_action
    attributes:
      label: Trigger GitHub Action?
      options:
        - label: Yes, deploy Governance Layer test suite
          required: false
  
  - type: dropdown
    id: action_type
    attributes:
      label: Action Type
      description: If triggering an action, which type?
      options:
        - Governance Deployment
        - Role Assignment Test
        - Voting Simulation
        - Immutable Config Audit
    validations:
      required: false
  
  - type: markdown
    attributes:
      value: |
        ## Additional Information
        
        This issue will be automatically tagged with `trae-phase`, `auto-trigger`, and `review-needed` labels.
        
        The associated markdown prompt file will be created in the `/trae_prompts/` directory.