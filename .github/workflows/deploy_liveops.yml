name: Deploy LiveOps System

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      config_profile:
        description: 'Configuration profile'
        required: true
        default: 'default'
        type: string
  push:
    branches: [ main ]
    paths:
      - 'liveops/**'
      - 'sentinel_decider.py'
      - 'main.py'
      - 'config/liveops_config.json'
  issues:
    types: [opened, edited]

jobs:
  check_issue:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_label.outputs.should_deploy }}
    steps:
      - name: Check if issue has LiveOps label
        id: check_label
        run: |
          issue_labels=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" \
            | jq -r '.labels[].name')
          
          if echo "$issue_labels" | grep -q "LiveOps"; then
            echo "::set-output name=should_deploy::true"
          else
            echo "::set-output name=should_deploy::false"
          fi

  test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'issues' || needs.check_issue.outputs.should_deploy == 'true' }}
    needs: [check_issue]
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run tests
        run: |
          python test_liveops.py --test all
  
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Create deployment package
        run: |
          mkdir -p deployment_package
          cp -r liveops deployment_package/
          cp sentinel_decider.py deployment_package/
          cp main.py deployment_package/
          cp -r config deployment_package/
          cp -r deployment deployment_package/
          cp requirements.txt deployment_package/
          
          # Create version file
          echo "version: ${{ github.sha }}" > deployment_package/version.txt
          echo "build_date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> deployment_package/version.txt
          echo "environment: ${{ github.event.inputs.environment || 'production' }}" >> deployment_package/version.txt
          
          # Create deployment archive
          cd deployment_package
          zip -r ../trae_liveops_deployment.zip .
      
      - name: Upload deployment package
        uses: actions/upload-artifact@v2
        with:
          name: deployment-package
          path: trae_liveops_deployment.zip
  
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v2
      
      - name: Download deployment package
        uses: actions/download-artifact@v2
        with:
          name: deployment-package
          path: .
      
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      
      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        run: |
          # Transfer deployment package
          scp trae_liveops_deployment.zip ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/
          
          # Execute deployment script
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            cd ~
            mkdir -p AI-Sentinel-backup/$(date +%Y%m%d_%H%M%S)
            
            # Backup current deployment
            if [ -d "AI-Sentinel" ]; then
              cp -r AI-Sentinel/* AI-Sentinel-backup/$(date +%Y%m%d_%H%M%S)/
            fi
            
            # Create or update deployment directory
            mkdir -p AI-Sentinel
            
            # Extract deployment package
            unzip -o trae_liveops_deployment.zip -d AI-Sentinel
            
            # Set permissions
            chmod +x AI-Sentinel/*.py
            chmod +x AI-Sentinel/deployment/*.sh
            
            # Set up environment file if it doesn't exist
            if [ ! -f "AI-Sentinel/.env" ]; then
              cp AI-Sentinel/deployment/.env.example AI-Sentinel/.env
              echo "Created default .env file. Please update with actual credentials."
            fi
            
            # Set up supervisor if available
            if command -v supervisorctl &> /dev/null; then
              sudo cp AI-Sentinel/deployment/supervisor_config.ini /etc/supervisor/conf.d/trae_sentinel.conf
              sudo supervisorctl reread
              sudo supervisorctl update
              sudo supervisorctl restart trae_sentinel
            # Set up systemd if available
            elif [ -d "/etc/systemd/system" ]; then
              sudo cp AI-Sentinel/deployment/trae-sentinel.service /etc/systemd/system/
              sudo systemctl daemon-reload
              sudo systemctl enable trae-sentinel
              sudo systemctl restart trae-sentinel
            # Set up PM2 if available
            elif command -v pm2 &> /dev/null; then
              cd AI-Sentinel
              pm2 start deployment/ecosystem.config.js
              pm2 save
            else
              echo "No process manager found. Please install supervisor, systemd, or PM2."
            fi
            
            echo "Deployment completed at $(date)"
          EOF
      
      - name: Verify deployment
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            # Check if service is running
            if command -v supervisorctl &> /dev/null; then
              supervisorctl status trae_sentinel
            elif [ -d "/etc/systemd/system" ]; then
              systemctl status trae-sentinel
            elif command -v pm2 &> /dev/null; then
              pm2 status
            fi
            
            # Check logs for startup
            if [ -f "AI-Sentinel/logs/trae.log" ]; then
              tail -n 20 AI-Sentinel/logs/trae.log
            fi
          EOF