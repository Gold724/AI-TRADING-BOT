name: AI Trading Sentinel CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r requirements.txt
          
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,node_modules,.git,__pycache__,chrome*,temp_chrome*,drivers,chrome_profile*
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,node_modules,.git,__pycache__,chrome*,temp_chrome*,drivers,chrome_profile*

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt
          
      - name: Basic validation
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python -c "import tradebot_sentinel_bulenox_automation; print('✅ Bot import successful')"
          python -c "import bulenox_gold_scalping_strategy; print('✅ Strategy import successful')"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko
          
      - name: Deploy to Contabo VPS
        env:
          VPS_HOST: ${{ secrets.CONTABO_VPS_HOST }}
          VPS_USERNAME: ${{ secrets.CONTABO_VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.CONTABO_VPS_PASSWORD }}
          SSH_PORT: ${{ secrets.CONTABO_SSH_PORT }}
        run: |
          python deploy_to_contabo.py --ip "$VPS_HOST" --username "$VPS_USERNAME" --password "$VPS_PASSWORD" --port "$SSH_PORT"