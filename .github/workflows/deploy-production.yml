# AI Trading Sentinel - Production Deployment Pipeline
# Automated CI/CD for Contabo VPS deployment with security and monitoring

name: Deploy to Production

on:
  push:
    branches: [ main, production ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    types: [ closed ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_deploy:
        description: 'Force deployment (skip tests)'
        required: false
        default: false
        type: boolean

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ai-trading-sentinel
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Security and Code Quality Checks
  security-scan:
    name: Security & Quality Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.force_deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  # Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    if: always() && (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock playwright
          playwright install chromium

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Unit Tests
        if: matrix.test-type == 'unit'
        run: |
          pytest tests/unit/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Run Integration Tests
        if: matrix.test-type == 'integration'
        env:
          SIMULATION: true
          BROWSER_HEADLESS: true
        run: |
          pytest tests/integration/ -v --maxfail=3

      - name: Run E2E Tests
        if: matrix.test-type == 'e2e'
        env:
          SIMULATION: true
          BROWSER_HEADLESS: true
          BULENOX_USERNAME: ${{ secrets.TEST_BULENOX_USERNAME }}
          BULENOX_PASSWORD: ${{ secrets.TEST_BULENOX_PASSWORD }}
        run: |
          pytest tests/e2e/ -v --maxfail=1

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            htmlcov/
            coverage.xml
            pytest-report.html

  # Docker Build and Push
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch')
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}

      - name: Run Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'docker-trivy-results.sarif'

      - name: Upload Docker Security Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'docker-trivy-results.sarif'

  # Deploy to Production
  deploy-production:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://${{ secrets.PRODUCTION_DOMAIN }}
    
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.production.yml
            deploy_contabo.sh
            docker/
            scripts/

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_KEY }}

      - name: Add VPS to Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.CONTABO_HOST }} >> ~/.ssh/known_hosts

      - name: Create Deployment Package
        run: |
          tar -czf deployment.tar.gz \
            docker-compose.production.yml \
            docker/ \
            scripts/ \
            deploy_contabo.sh

      - name: Upload Deployment Package
        run: |
          scp deployment.tar.gz ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}:/tmp/

      - name: Deploy to Production
        run: |
          ssh ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }} << 'EOF'
            set -e
            
            # Extract deployment package
            cd /opt/ai-trading-sentinel
            tar -xzf /tmp/deployment.tar.gz
            
            # Set environment variables
            export DOCKER_IMAGE="${{ needs.docker-build.outputs.image-tag }}"
            export BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            export VCS_REF="${{ github.sha }}"
            
            # Create backup of current deployment
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml docker-compose.backup.yml
              docker-compose down --remove-orphans || true
            fi
            
            # Update configuration
            cp docker-compose.production.yml docker-compose.yml
            
            # Pull latest image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ needs.docker-build.outputs.image-tag }}
            
            # Deploy with health checks
            docker-compose up -d --remove-orphans
            
            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            timeout 300 bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 5; done'
            
            # Verify deployment
            if curl -f http://localhost/health > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              # Clean up old images
              docker image prune -f
            else
              echo "❌ Health check failed, rolling back..."
              docker-compose down
              if [ -f docker-compose.backup.yml ]; then
                cp docker-compose.backup.yml docker-compose.yml
                docker-compose up -d
              fi
              exit 1
            fi
            
            # Cleanup
            rm -f /tmp/deployment.tar.gz
          EOF

      - name: Run Post-Deployment Tests
        run: |
          ssh ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }} << 'EOF'
            # Basic health checks
            curl -f http://localhost/health
            curl -f http://localhost/api/status
            
            # Check container status
            docker-compose ps
            
            # Check logs for errors
            docker-compose logs --tail=50 trading-sentinel | grep -i error || true
          EOF

      - name: Notify Deployment Status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  # Rollback Job (Manual Trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'rollback'
    environment:
      name: production
    
    steps:
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.CONTABO_SSH_KEY }}

      - name: Rollback to Previous Version
        run: |
          ssh ${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }} << 'EOF'
            cd /opt/ai-trading-sentinel
            
            if [ -f docker-compose.backup.yml ]; then
              echo "Rolling back to previous version..."
              docker-compose down
              cp docker-compose.backup.yml docker-compose.yml
              docker-compose up -d
              
              # Wait for rollback to complete
              sleep 30
              
              # Verify rollback
              if curl -f http://localhost/health > /dev/null 2>&1; then
                echo "✅ Rollback successful!"
              else
                echo "❌ Rollback failed!"
                exit 1
              fi
            else
              echo "❌ No backup found for rollback!"
              exit 1
            fi
          EOF

# Workflow-level environment variables
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-trading-sentinel