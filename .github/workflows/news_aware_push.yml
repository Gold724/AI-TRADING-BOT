name: News-Aware Trading System Update

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  update-news-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch economic news data
        run: python fetch_news.py

      - name: Update banned trading periods
        run: python -c "from news_filter import update_banned_periods; update_banned_periods()"

      - name: Commit and push if changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/forex_news.json data/banned_periods.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "📅 Update economic calendar and banned trading periods" -a
            git push
          )

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -f data/forex_news.json ]; then
            HIGH_IMPACT_COUNT=$(python -c "import json; f=open('data/forex_news.json'); events=json.load(f); f.close(); print(len([e for e in events if e.get('impact')=='high']))")
            
            curl -X POST -H "Content-type: application/json" \
              --data "{\"text\":\"📅 *ECONOMIC CALENDAR UPDATED* 📅\n• Calendar data refreshed successfully\n• Found $HIGH_IMPACT_COUNT high-impact events\n• Trading filters updated\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            curl -X POST -H "Content-type: application/json" \
              --data "{\"text\":\"⚠️ *ECONOMIC CALENDAR UPDATE FAILED* ⚠️\nThe scheduled news data update failed. Please check the GitHub Actions logs.\"}" \
              "$SLACK_WEBHOOK_URL"
          fi