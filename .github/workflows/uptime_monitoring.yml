name: Uptime Monitoring

on:
  schedule:
    - cron: '*/60 * * * *'  # Run every hour
  workflow_dispatch:  # Allow manual triggering

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check API health
        id: health_check
        run: |
          python -c "import requests, sys, json; \
          try: \
            response = requests.get('http://${{ secrets.CONTABO_VPS_IP }}:5000/api/health', timeout=10); \
            print(f'Status code: {response.status_code}'); \
            print(f'Response: {response.text}'); \
            if response.status_code == 200 and json.loads(response.text).get('status') == 'ok': \
              sys.exit(0); \
            else: \
              sys.exit(1); \
          except Exception as e: \
            print(f'Error: {str(e)}'); \
            sys.exit(1)"
        continue-on-error: true

      - name: Send success notification
        if: steps.health_check.outcome == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,message,commit,author,action,eventName,ref,workflow
          custom_payload: |
            {
              "attachments": [
                {
                  "color": "good",
                  "text": ":white_check_mark: Trae API health check passed",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "Healthy",
                      "short": true
                    },
                    {
                      "title": "Time",
                      "value": "${{ github.event.repository.updated_at }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send failure notification
        if: steps.health_check.outcome == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,message,commit,author,action,eventName,ref,workflow
          custom_payload: |
            {
              "attachments": [
                {
                  "color": "danger",
                  "text": ":x: Trae API health check failed",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "Unhealthy",
                      "short": true
                    },
                    {
                      "title": "Time",
                      "value": "${{ github.event.repository.updated_at }}",
                      "short": true
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Trigger auto-restart if needed
        if: steps.health_check.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CONTABO_VPS_IP }}
          username: ${{ secrets.CONTABO_USERNAME || 'root' }}
          port: ${{ secrets.CONTABO_SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/ai-trading-sentinel
            sudo systemctl restart trae
            echo "Attempted to restart trae service"