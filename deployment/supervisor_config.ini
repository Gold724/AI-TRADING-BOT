[program:trae_sentinel]
command=python %(ENV_TRAE_HOME)s/main.py
directory=%(ENV_TRAE_HOME)s
autostart=true
autorestart=true
startretries=10
startsecs=10
stopwaitsecs=30
stdout_logfile=%(ENV_TRAE_HOME)s/logs/supervisor_stdout.log
stderr_logfile=%(ENV_TRAE_HOME)s/logs/supervisor_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
environment=
    PYTHONUNBUFFERED=1,
    TRAE_ENV=production,
    TRAE_PHASE=10,
    TRAE_LIVEOPS=true

[supervisord]
logfile=%(ENV_TRAE_HOME)s/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=%(ENV_TRAE_HOME)s/supervisord.pid
nodaemon=false

[unix_http_server]
file=%(ENV_TRAE_HOME)s/supervisor.sock

[supervisorctl]
serverurl=unix://%(ENV_TRAE_HOME)s/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface