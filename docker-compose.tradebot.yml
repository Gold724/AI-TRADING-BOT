# TradeBot Sentinel - Docker Compose Configuration
# Complete cloud deployment setup with monitoring and logging

version: '3.8'

services:
  tradebot-sentinel:
    build:
      context: .
      dockerfile: Dockerfile.tradebot
    container_name: tradebot-sentinel
    restart: unless-stopped
    environment:
      - BULENOX_USERNAME=${BULENOX_USERNAME}
      - BULENOX_PASSWORD=${BULENOX_PASSWORD}
      - BROKER_URL=${BROKER_URL:-https://bulenox.projectx.com/login}
      - HEADLESS=${HEADLESS:-true}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY=${RETRY_DELAY:-2}
      - SCREENSHOT_ON_ERROR=${SCREENSHOT_ON_ERROR:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
    volumes:
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
      - ./data:/app/data
      - ./trade_requests:/app/trade_requests
      - ./secrets.json:/app/secrets.json:ro
    ports:
      - "8080:8080"  # Health check endpoint
      - "5900:5900"  # VNC access (optional)
    networks:
      - tradebot-network
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: tradebot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tradebot123}
    volumes:
      - redis-data:/data
    networks:
      - tradebot-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: tradebot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - tradebot-network
    depends_on:
      - tradebot-sentinel

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: tradebot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - tradebot-network
    depends_on:
      - prometheus

  # Log aggregation with Loki
  loki:
    image: grafana/loki:latest
    container_name: tradebot-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tradebot-network

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: tradebot-promtail
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/tradebot:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - tradebot-network
    depends_on:
      - loki

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: tradebot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - tradebot-network
    depends_on:
      - tradebot-sentinel
      - grafana

volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  tradebot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16