services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: trading_sentinel
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_sentinel"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Trading Sentinel - Account 1
  trading-sentinel-1:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - ACCOUNT_ID=account_1
      - DATABASE_URL=postgresql://trading_user:secure_password@postgres:5432/trading_sentinel
      - REDIS_URL=redis://:redis_password@redis:6379/0
      - FLASK_ENV=production
      - FLASK_APP=main.py
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - WEBSOCKET_PORT=8001
      - METRICS_PORT=9001
      - LOG_LEVEL=INFO
      - ACCOUNT_NAME=Primary Trading Account
      - MAX_POSITION_SIZE=10000
      - DAILY_LOSS_LIMIT=1000
    ports:
      - "5001:5000"
      - "8001:8001"
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/accounts/account_1:/app/data
      - ./logs/account_1:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Trading Sentinel - Account 2
  trading-sentinel-2:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - ACCOUNT_ID=account_2
      - DATABASE_URL=postgresql://trading_user:secure_password@postgres:5432/trading_sentinel
      - REDIS_URL=redis://:redis_password@redis:6379/1
      - FLASK_ENV=production
      - FLASK_APP=main.py
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - WEBSOCKET_PORT=8002
      - METRICS_PORT=9002
      - LOG_LEVEL=INFO
      - ACCOUNT_NAME=Secondary Trading Account
      - MAX_POSITION_SIZE=5000
      - DAILY_LOSS_LIMIT=500
    ports:
      - "5002:5000"
      - "8002:8002"
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/accounts/account_2:/app/data
      - ./logs/account_2:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Trading Sentinel - Account 3
  trading-sentinel-3:
    build: 
      context: .
      dockerfile: Dockerfile
    environment:
      - ACCOUNT_ID=account_3
      - DATABASE_URL=postgresql://trading_user:secure_password@postgres:5432/trading_sentinel
      - REDIS_URL=redis://:redis_password@redis:6379/2
      - FLASK_ENV=production
      - FLASK_APP=main.py
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - WEBSOCKET_PORT=8003
      - METRICS_PORT=9003
      - LOG_LEVEL=INFO
      - ACCOUNT_NAME=Test Trading Account
      - MAX_POSITION_SIZE=1000
      - DAILY_LOSS_LIMIT=100
    ports:
      - "5003:5000"
      - "8003:8003"
      - "9003:9003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/accounts/account_3:/app/data
      - ./logs/account_3:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - trading-sentinel-1
      - trading-sentinel-2
      - trading-sentinel-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:

networks:
  default:
    driver: bridge