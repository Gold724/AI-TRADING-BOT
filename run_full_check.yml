name: AI Trading Sentinel - Full System Check

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours

jobs:
  full-system-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
          CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
          wget -q "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip"
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install xvfbwrapper selenium webdriver-manager
      
      - name: Set up environment variables
        run: |
          echo "CHROME_BINARY=/usr/bin/google-chrome" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=/usr/local/bin/chromedriver" >> $GITHUB_ENV
          echo "HEADLESS=true" >> $GITHUB_ENV
          echo "VAST_INSTANCE_IP=${{ secrets.VAST_INSTANCE_IP }}" >> $GITHUB_ENV
          echo "SSH_USER=${{ secrets.SSH_USER }}" >> $GITHUB_ENV
      
      - name: Set up SSH key
        if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VAST_INSTANCE_IP }} >> ~/.ssh/known_hosts
      
      - name: Run backend API health check
        run: |
          # Check if API is already running on the server
          if curl -s "http://${{ secrets.VAST_INSTANCE_IP }}:5000/api/health" | grep -q "status":"ok"; then
            echo "✅ API is already running and healthy"
          else
            echo "Starting API on remote server..."
            ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.VAST_INSTANCE_IP }} \
              "cd ~/ai-trading-sentinel && \
              source ~/sentinel-venv/bin/activate && \
              nohup python cloud_main.py > logs/cloud_main.log 2>&1 &"
            
            # Wait for API to start
            echo "Waiting for API to start (10 seconds)..."
            sleep 10
            
            # Check API health
            if curl -s "http://${{ secrets.VAST_INSTANCE_IP }}:5000/api/health" | grep -q "status":"ok"; then
              echo "✅ API started successfully"
            else
              echo "❌ Failed to start API"
              exit 1
            fi
          fi
      
      - name: Run Selenium login test
        run: |
          mkdir -p logs screenshots
          xvfb-run -a python executor_bulenox.py --test
      
      - name: Execute trade via API
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"symbol": "GCZ25", "action": "BUY", "lots": 1, "broker": "BULENOX", "mode": "demo"}' \
            "http://${{ secrets.VAST_INSTANCE_IP }}:5000/api/trade/stealth"
      
      - name: Upload logs and screenshots
        uses: actions/upload-artifact@v3
        with:
          name: logs-and-screenshots
          path: |
            logs/
            screenshots/
      
      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}