[program:trae-sentinel]
command=python bulenox_trade_sentinel.py
directory=/root/ai-trading-sentinel
autostart=true
autorestart=true
stderr_logfile=/var/log/trae-sentinel.err.log
stdout_logfile=/var/log/trae-sentinel.out.log
environment=
    BULENOX_USERNAME="%(ENV_BULENOX_USERNAME)s",
    BULENOX_PASSWORD="%(ENV_BULENOX_PASSWORD)s",
    API_KEY="%(ENV_API_KEY)s",
    BULENOX_PROFILE_PATH="/root/.config/google-chrome",
    BULENOX_PROFILE_NAME="Default",
    AUTO_LOGIN="true"